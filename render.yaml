services:
  - type: web
    name: trustmate-mcp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: trustmate-cache
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: MOCK
        value: "false"
      - key: OPENROUTER_EXPLAINER_ENABLED
        value: "false"
      - key: REVIEW_PROVIDER
        value: none
      - key: URLHAUS_AUTHORIZED
        value: "false"
      - key: URLHAUS_LIVE_TEST
        value: "false"
      - key: MCP_BEARER_TOKEN
        generateValue: true
      - key: MCP_ALLOWED_HOSTS
        fromService:
          type: web
          name: trustmate-mcp
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CHANNEL3_API_KEY
        sync: false
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SQLITE_PATH
        value: /var/data/trustmate.sqlite
      - key: CACHE_TTL_DAYS
        value: "3"
